name: CD - Build, Scan, Push and Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['**.md', 'img/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'img/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  # ---------------------------------------------------------------
  # 1) CI: lint + pruebas (si falla, no se construye nada)
  # ---------------------------------------------------------------
  test:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ---------------------------------------------------------------
  # 2) Build multi-stage, escaneo de vulnerabilidades y push
  # ---------------------------------------------------------------
  build-and-push:
    name: Build, scan y push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Calcular version de la app
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generar tags y labels de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build de la imagen (carga local para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades (Docker Scout)
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: local://${{ env.IMAGE_NAME }}:${{ github.sha }}
          only-severities: critical,high
          only-fixed: true
          exit-code: false
          summary: true
          sarif-file: scout-report.sarif
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir reporte SARIF a GitHub Security
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scout-report.sarif
          category: docker-scout

      - name: Push de la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Resumen
        if: github.event_name != 'pull_request'
        run: |
          echo "## Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # 3) Deploy automatico a STAGING
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy a staging
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ vars.PUBLIC_HOST }}:${{ vars.APP_PORT }}/health
    steps:
      - name: Checkout (script de despliegue)
        uses: actions/checkout@v6

      - name: Desplegar en staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER: ${{ vars.CONTAINER_NAME }}
          PUBLIC_PORT: ${{ vars.APP_PORT }}
          CHECK_PORT: ${{ vars.CHECK_PORT }}
          APP_ENV: staging
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,CONTAINER,PUBLIC_PORT,CHECK_PORT,APP_ENV
          script_path: scripts/deploy.sh

  # ---------------------------------------------------------------
  # 4) Deploy a PRODUCTION (requiere aprobacion manual)
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy a production
    needs: [build-and-push, deploy-staging]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.PUBLIC_HOST }}/health
    steps:
      - name: Checkout (script de despliegue)
        uses: actions/checkout@v6

      - name: Desplegar en produccion via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ vars.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER: ${{ vars.CONTAINER_NAME }}
          PUBLIC_PORT: ${{ vars.APP_PORT }}
          CHECK_PORT: ${{ vars.CHECK_PORT }}
          APP_ENV: production
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,CONTAINER,PUBLIC_PORT,CHECK_PORT,APP_ENV
          script_path: scripts/deploy.sh
